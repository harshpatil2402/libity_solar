name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Droplet and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/libity_solar
            
            # Force the server to match GitHub exactly (ignores manual server edits)
            git fetch origin
            git reset --hard origin/main
            
            # Rebuild the Docker image
            docker build -t libity_solar_app .
            
            # Stop and remove the old running website
            docker stop solar_saas || true
            docker rm solar_saas || true
            
            # Start the newly updated website with the environment variables injected
            docker run -d -p 80:5000 --name solar_saas --env-file .env --restart unless-stopped libity_solar_app
            
            # Clean up old unused images to save disk space
            docker system prune -af